version: '3'
services:
  mysql-test:
    image: mysql:lts
    restart: always
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: qwer1234@#$_
      TZ: Asia/Shanghai
    ports:
      - 3306:3306
    volumes:
      - ./data:/var/lib/mysql
      - ./conf/my.cnf:/etc/mysql/my.cnf
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci